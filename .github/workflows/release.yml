name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0); defaults to v<package.json version>"
        required: false
        type: string
      draft:
        description: "Create GitHub Release as a draft"
        required: false
        default: false
        type: boolean
      publish_marketplaces:
        description: "Publish to VS Code Marketplace and Open VSX when secrets are configured"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-vsix:
    name: Build & Verify VSIX (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            package_script: package:vsix:win32
          - os: ubuntu-latest
            target: linux-x64
            package_script: package:vsix:linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Python 3.11
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Verify release tag matches package.json version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          pkg_ver="$(node -p 'require("./package.json").version')"
          expected_tag="v${pkg_ver}"
          if [ "${EVENT_NAME}" = "push" ]; then
            actual_tag="${REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            actual_tag="${INPUT_TAG}"
          else
            actual_tag="${expected_tag}"
          fi
          if [ "${actual_tag}" != "${expected_tag}" ]; then
            echo "ERROR: Release tag '${actual_tag}' does not match package.json version '${pkg_ver}' (expected '${expected_tag}')"
            exit 1
          fi
          echo "Verified release tag ${actual_tag} == package.json ${pkg_ver}"

      - name: Install Node dependencies
        run: npm ci

      - name: Build native broker from C source & verify Checkwash zipapp SHA-256
        run: npm run build:bundled

      - name: Compile TypeScript
        run: npm run compile

      - name: Run cross-platform headless test suite
        env:
          CW_TEST_PYTHON_EXE: ${{ steps.setup-python.outputs.python-path }}
        run: npm test

      - name: Package platform VSIX & run zero-leak hygiene audit
        run: npm run ${{ matrix.package_script }}

      - name: Upload built VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vsix-${{ matrix.target }}
          path: checkwash-lens-*-${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release & Optional Marketplaces
    needs: build-vsix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Download built platform VSIX packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-vsix-*
          path: release-assets
          merge-multiple: true

      - name: Verify both platform VSIX assets & generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          pkg_ver="$(node -p 'require("./package.json").version')"
          win_vsix="checkwash-lens-${pkg_ver}-win32-x64.vsix"
          linux_vsix="checkwash-lens-${pkg_ver}-linux-x64.vsix"
          test -f "release-assets/${win_vsix}"
          test -f "release-assets/${linux_vsix}"
          (
            cd release-assets
            sha256sum "${linux_vsix}" "${win_vsix}" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          cat release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          pkg_ver="$(node -p 'require("./package.json").version')"
          cw_ver="$(node -p 'require("./bundled/upstream.json").checkwash.version')"
          cw_sha="$(node -p 'require("./bundled/upstream.json").checkwash.sha256')"
          if [ "${EVENT_NAME}" = "push" ]; then
            rel_tag="${REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            rel_tag="${INPUT_TAG}"
          else
            rel_tag="v${pkg_ver}"
          fi

          win_vsix="release-assets/checkwash-lens-${pkg_ver}-win32-x64.vsix"
          linux_vsix="release-assets/checkwash-lens-${pkg_ver}-linux-x64.vsix"
          sums_file="release-assets/SHA256SUMS.txt"

          notes_file="$(mktemp)"
          {
            echo "## Checkwash Lens ${rel_tag}"
            echo ""
            echo "Built transparently from source via GitHub Actions on \`windows-latest\` (\`win32-x64\`) and \`ubuntu-latest\` (\`linux-x64\`)."
            echo ""
            echo "### Bundled Engine Provenance"
            echo "- **Checkwash**: \`v${cw_ver}\` (\`checkwash.pyz\`, SHA-256 \`${cw_sha}\`)"
            echo "- **Native Brokers**: compiled from \`native/checkwash_broker.c\` and \`native/checkwash_broker_posix.c\` (\`CWBROKER1\`)"
            echo ""
            echo "### SHA-256 Checksums"
            echo '```text'
            cat "${sums_file}"
            echo '```'
          } > "${notes_file}"

          create_args=(
            "${rel_tag}"
            "${win_vsix}"
            "${linux_vsix}"
            "${sums_file}"
            --title "Checkwash Lens ${rel_tag}"
            --notes-file "${notes_file}"
          )
          if [ "${EVENT_NAME}" = "push" ]; then
            create_args+=(--verify-tag)
          else
            create_args+=(--target "${GITHUB_SHA}")
          fi
          if [ "${INPUT_DRAFT:-false}" = "true" ]; then
            create_args+=(--draft)
          fi

          if gh release view "${rel_tag}" >/dev/null 2>&1; then
            echo "Release ${rel_tag} already exists; uploading assets with --clobber..."
            gh release upload "${rel_tag}" "${win_vsix}" "${linux_vsix}" "${sums_file}" --clobber
          else
            gh release create "${create_args[@]}"
          fi
          rm -f "${notes_file}"

      - name: Publish to VS Code Marketplace (optional)
        if: ${{ github.event_name == 'push' || inputs.publish_marketplaces != false }}
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "VSCE_PAT secret is not configured; skipping VS Code Marketplace publish."
            exit 0
          fi
          for vsix in release-assets/*.vsix; do
            echo "Publishing ${vsix} to VS Code Marketplace..."
            npx --yes @vscode/vsce publish --packagePath "${vsix}"
          done

      - name: Publish to Open VSX Registry (optional)
        if: ${{ github.event_name == 'push' || inputs.publish_marketplaces != false }}
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "OVSX_PAT secret is not configured; skipping Open VSX Registry publish."
            exit 0
          fi
          for vsix in release-assets/*.vsix; do
            echo "Publishing ${vsix} to Open VSX Registry..."
            npx --yes ovsx publish "${vsix}"
          done
